# HAULBOTS: builds an unsigned iPhone .ipa on a free GitHub macOS runner.
# Install the result with Sideloadly (it signs the app with your Apple ID).
name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GODOT_VER: "4.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip
        shell: bash
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Source: $ZIP"
          mkdir -p src && unzip -q "$ZIP" -d src
          PROJ=$(dirname "$(find src -maxdepth 3 -name project.godot | head -1)")
          echo "PROJ=$GITHUB_WORKSPACE/$PROJ" >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VER }}-ios-v1

      - name: Install Godot and iOS export template
        shell: bash
        run: |
          if [ ! -x ~/godot/Godot.app/Contents/MacOS/Godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_macos.universal.zip"
            unzip -q g.zip && rm g.zip
          fi
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VER}.stable"
          if [ ! -f "$T/ios.zip" ]; then
            mkdir -p "$T"
            curl -fsSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_export_templates.tpz"
            unzip -q -j /tmp/t.tpz templates/ios.zip templates/version.txt -d "$T"
            rm /tmp/t.tpz
          fi
          ls -l "$T"

      - name: Export Xcode project
        shell: bash
        run: |
          G=~/godot/Godot.app/Contents/MacOS/Godot
          cd "$PROJ"
          mkdir -p build/ios
          $G --headless --import . || true
          $G --headless --export-release "iOS" build/ios/haulbots.ipa
          test -d build/ios/haulbots.xcodeproj
          ls -l build/ios

      - name: Build unsigned app
        shell: bash
        run: |
          cd "$PROJ/build/ios"
          xcodebuild -project haulbots.xcodeproj -scheme haulbots -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -40
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/haulbots.app Payload/
          zip -qry HAULBOTS-ios.ipa Payload
          ls -l HAULBOTS-ios.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HAULBOTS-ios
          path: ${{ env.PROJ }}/build/ios/HAULBOTS-ios.ipa
          compression-level: 0
          retention-days: 30
